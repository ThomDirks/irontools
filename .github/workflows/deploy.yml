name: Build site

# GitHub Pages serves this repo from the main branch. On every push this
# tests the calculators, builds the site and commits the result to the repo
# root (index.html + assets/), so the live site always matches the source.
on:
  push:
    branches: [main]
    paths-ignore: ["index.html", "assets/**", "favicon.png", ".nojekyll"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
      - name: Commit the built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets favicon.png .nojekyll
          if git diff --cached --quiet; then echo "Site unchanged"; exit 0; fi
          git commit -m "Build site [skip ci]"
          git push
